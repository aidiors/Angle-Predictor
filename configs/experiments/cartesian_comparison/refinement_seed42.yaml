name: cartesian_refinement_5200_seed42
entrypoint: angle_predictor.experiments.angle:run
seed: 42
tracking:
  experiment_name: angle-predictor-cartesian-comparison
  system_metrics: true
  registered_model_name: null
dataset:
  name: synthetic_lines
  version: v12_background_sources_center_sprites
  source: data/datasets/synthetic_lines_150k
params:
  data:
    root: data/datasets/synthetic_lines_150k
    batch_size: 32
    num_workers: 6
    split_seed: 42
    train_fraction: 0.8
    val_fraction: 0.1
  model:
    kind: cartesian_refinement
    coarse_model:
      kind: cartesian_convnext
      backbone_name: convnext_tiny
      pretrained: true
      head: spatial
      head_hidden: 256
      spatial_bins: 4
      dropout: 0.1
    coarse_checkpoint: checkpoints/cartesian_spatial_seed42.pt
    coarse_run_id: '00000000000000000000000000000000'
    coarse_split_seed: 42
    crop_size:
    - 384
    - 65
    strip_width_px: 32.0
    window_deg: 4.0
    fine_channels:
    - 16
    - 32
    - 128
    refinement_hidden: 128
    train_coarse: false
  preprocessing:
    output_size:
    - 256
    - 256
    mean:
    - 0.5
    - 0.5
    - 0.5
    std:
    - 0.5
    - 0.5
    - 0.5
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    jitter_probability: 0.7
    gaussian_probability: 0.3
    speckle_probability: 0.15
    projection: cartesian
  loss:
    kind: vector_charbonnier
    charbonnier_epsilon: 0.1
  optimizer:
    kind: musgd
    lr: 0.0007975423028925935
    weight_decay: 0.010122210155621848
    momentum: 0.95
    nesterov: true
    muon: 0.7
    sgd: 0.3
  scheduler:
    kind: cosine_annealing
    eta_min: 1.0e-08
  training:
    max_steps: 5200
    warmup_steps: 200
    clip_grad_norm: 1.0
    precision: bf16
    log_every_steps: 50
    validate_every_steps: 1300
    output_dir: outputs/experiments
    keep_local_checkpoints: true
