[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "angle-predictor"
version = "0.2.0"
description = "Line-angle estimation with signed polar geometry and coarse-to-fine refinement"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mlflow>=3.0,<4",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[project.scripts]
angle-train = "angle_predictor.cli.main:main"
angle-predict = "angle_predictor.cli.predict:main"

[tool.uv.build-backend]
module-name = "angle_predictor"

[tool.uv]
default-groups = ["dev", "training"]

[dependency-groups]
dev = [
    "pre-commit>=4.6,<5",
    "ruff>=0.16,<0.17",
    "ty>=0.0.84,<0.1",
]
training = [
    "numpy>=2,<3",
    "nvidia-ml-py>=12,<14",
    "pillow>=10,<13",
    "psutil>=5.9,<8",
    "timm==1.0.30",
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
]
synthetic-data = [
    "numpy>=2,<3",
    "opencv-python>=4.8,<5",
    "pillow>=10,<13",
    "tqdm>=4.66,<5",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"
root = ["./src"]
