name: angle-predictor

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - type: bind
        source: ${MLFLOW_DATA_DIR:-../../.mlflow}
        target: /mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    restart: unless-stopped
